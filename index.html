<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Order Error Test</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-top: 5px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid #e5e5e5;
      text-align: left;
    }

    th {
      background: #f7f7f7;
      font-size: 14px;
    }

    td {
      font-size: 14px;
    }

    /* View button */

    .view-btn {
      background: #000;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .view-btn:hover {
      background: #333;
    }


    /* Status */

    .status-normal {
      color: #15803d;
      font-weight: 500;
    }

    .status-error {
      color: #dc2626;
      font-weight: 500;
    }


    /* Pagination */

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .pagination {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .page-btn {
      border: 1px solid #ddd;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .page-btn:hover {
      background: #eee;
    }

    .page-btn.active {
      background: #000;
      color: white;
      border-color: #000;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }


    /* Modal */

    .modal-overlay {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.5);

      padding: 20px;

      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 450px;

      background: white;

      border-radius: 12px;

      padding: 25px;

      position: relative;
    }

    .modal h3 {
      margin-top: 0;
    }

    .modal-info {
      color: #666;
      line-height: 1.6;
    }

    .close-btn {
      position: absolute;

      top: 10px;
      right: 15px;

      background: transparent;
      border: none;

      font-size: 26px;

      cursor: pointer;
    }

    .modal-footer {
      margin-top: 25px;

      display: flex;
      justify-content: flex-end;
    }


    /* Modal action button */

    .modal-action-btn {
      background: #000;
      color: white;

      border: none;

      padding: 10px 18px;

      border-radius: 6px;

      cursor: pointer;
    }

    .modal-action-btn:hover {
      background: #333;
    }


    /* Toast */

    .toast {
      position: fixed;

      right: 25px;
      bottom: 25px;

      display: none;

      background: #222;
      color: white;

      padding: 14px 20px;

      border-radius: 8px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.25);

      z-index: 2000;
    }

    .toast.show {
      display: block;
    }

    .toast-title {
      color: #ff5555;
      font-weight: bold;
    }


    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- Header -->

    <div class="top-bar">

      <div>

        <h2>
          Orders
        </h2>

        <div class="subtitle">
          1000 records · 100 records per page
        </div>

      </div>

      <div id="pageInfo"></div>

    </div>


    <!-- Table -->

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              ID
            </th>

            <th>
              Customer
            </th>

            <th>
              PO Number
            </th>

            <th>
              Status
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody id="tableBody"></tbody>

      </table>

    </div>


    <!-- Pagination -->

    <div class="pagination-container">

      <button
        id="previousBtn"
        class="page-btn"
      >
        Previous
      </button>


      <div
        id="pagination"
        class="pagination"
      ></div>


      <button
        id="nextBtn"
        class="page-btn"
      >
        Next
      </button>

    </div>

  </div>


  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div
    id="modalOverlay"
    class="modal-overlay"
  >

    <div class="modal">


      <button
        id="closeModal"
        class="close-btn"
      >
        ×
      </button>


      <h3>
        Order Details
      </h3>


      <div
        id="modalInfo"
        class="modal-info"
      ></div>


      <div class="modal-footer">

        <button
          id="modalActionBtn"
          class="modal-action-btn"
        >
          Process Order
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ERROR TOAST
  ====================================================== -->

  <div
    id="errorToast"
    class="toast"
  >

    <span class="toast-title">
      Error:
    </span>

    Something went wrong.

  </div>


  <script>

    // =====================================================
    // CONFIGURATION
    // =====================================================

    const TOTAL_ROWS = 1000;

    const ROWS_PER_PAGE = 100;

    const TOTAL_PAGES =
      Math.ceil(
        TOTAL_ROWS / ROWS_PER_PAGE
      );


    // =====================================================
    // FIXED ERROR IDS
    // =====================================================
    //
    // These IDs NEVER change between page reloads.
    //
    // If ID 2 is here:
    //     ID 2 -> Error
    //
    // If ID 4 is not here:
    //     ID 4 -> Normal
    //
    // Change this list whenever you want different
    // rows to produce the error.
    //
    // =====================================================

    const ERROR_IDS = [

      2,
      3,
      7,
      18,
      25,
      31,
      45,
      67,
      89,
      102,
      150,
      201,
      250,
      301,
      350,
      444,
      500,
      678,
      789,
      921

    ];


    // =====================================================
    // STATE
    // =====================================================

    let currentPage = 1;

    let selectedRowId = null;


    // =====================================================
    // DOM ELEMENTS
    // =====================================================

    const tableBody =
      document.getElementById(
        "tableBody"
      );


    const pagination =
      document.getElementById(
        "pagination"
      );


    const pageInfo =
      document.getElementById(
        "pageInfo"
      );


    const previousBtn =
      document.getElementById(
        "previousBtn"
      );


    const nextBtn =
      document.getElementById(
        "nextBtn"
      );


    const modalOverlay =
      document.getElementById(
        "modalOverlay"
      );


    const modalInfo =
      document.getElementById(
        "modalInfo"
      );


    const closeModal =
      document.getElementById(
        "closeModal"
      );


    const modalActionBtn =
      document.getElementById(
        "modalActionBtn"
      );


    const errorToast =
      document.getElementById(
        "errorToast"
      );


    // =====================================================
    // CREATE 1000 ROWS
    // =====================================================

    const data = [];


    for (
      let i = 1;
      i <= TOTAL_ROWS;
      i++
    ) {


      /*
       * Check the fixed ERROR_IDS list.
       *
       * NO Math.random() here.
       *
       * Therefore the result is always the same.
       */

      const hasError =
        ERROR_IDS.includes(i);


      data.push({

        id: i,

        customer:
          `Customer ${i}`,

        po:
          `PO-${String(i).padStart(5, "0")}`,

        status:
          "Pending",

        hasError:
          hasError

      });

    }


    // =====================================================
    // RENDER TABLE
    // =====================================================

    function renderTable() {

      tableBody.innerHTML = "";


      const startIndex =
        (currentPage - 1) *
        ROWS_PER_PAGE;


      const endIndex =
        startIndex +
        ROWS_PER_PAGE;


      const rows =
        data.slice(
          startIndex,
          endIndex
        );


      rows.forEach(row => {


        const tr =
          document.createElement(
            "tr"
          );


        // =================================================
        // STATUS
        // =================================================

        let statusHTML;


        if (row.hasError) {

          statusHTML = `

            <span class="status-error">
              Something went wrong
            </span>

          `;

        } else {

          statusHTML = `

            <span class="status-normal">
              Pending
            </span>

          `;

        }


        // =================================================
        // ROW HTML
        // =================================================

        tr.innerHTML = `

          <td>
            ${row.id}
          </td>


          <td>
            ${row.customer}
          </td>


          <td>
            ${row.po}
          </td>


          <td>
            ${statusHTML}
          </td>


          <td>

            <button
              class="view-btn"
              data-id="${row.id}"
            >
              View
            </button>

          </td>

        `;


        tableBody.appendChild(
          tr
        );

      });


      // =================================================
      // VIEW BUTTONS
      // =================================================

      const viewButtons =
        document.querySelectorAll(
          ".view-btn"
        );


      viewButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            function () {

              const id =
                Number(
                  this.dataset.id
                );


              openModal(id);

            }
          );

        }
      );


      updatePagination();

    }


    // =====================================================
    // PAGINATION
    // =====================================================

    function updatePagination() {

      pagination.innerHTML = "";


      pageInfo.textContent =
        `Page ${currentPage} of ${TOTAL_PAGES}`;


      previousBtn.disabled =
        currentPage === 1;


      nextBtn.disabled =
        currentPage === TOTAL_PAGES;


      for (
        let page = 1;
        page <= TOTAL_PAGES;
        page++
      ) {


        const button =
          document.createElement(
            "button"
          );


        button.className =
          "page-btn";


        button.textContent =
          page;


        if (
          page === currentPage
        ) {

          button.classList.add(
            "active"
          );

        }


        button.addEventListener(
          "click",
          function () {

            currentPage = page;

            renderTable();

          }
        );


        pagination.appendChild(
          button
        );

      }

    }


    // =====================================================
    // PREVIOUS PAGE
    // =====================================================

    previousBtn.addEventListener(
      "click",
      function () {

        if (
          currentPage > 1
        ) {

          currentPage--;

          renderTable();

        }

      }
    );


    // =====================================================
    // NEXT PAGE
    // =====================================================

    nextBtn.addEventListener(
      "click",
      function () {

        if (
          currentPage <
          TOTAL_PAGES
        ) {

          currentPage++;

          renderTable();

        }

      }
    );


    // =====================================================
    // OPEN MODAL
    // =====================================================

    function openModal(id) {

      selectedRowId = id;


      const row =
        data.find(
          item =>
            item.id === id
        );


      if (!row) {
        return;
      }


      modalInfo.innerHTML = `

        <strong>
          Order ID:
        </strong>

        ${row.id}

        <br>


        <strong>
          Customer:
        </strong>

        ${row.customer}

        <br>


        <strong>
          PO:
        </strong>

        ${row.po}

        <br>


        <strong>
          Status:
        </strong>


        ${
          row.hasError

            ? `

              <span class="status-error">
                Something went wrong
              </span>

            `

            : `

              <span class="status-normal">
                Pending
              </span>

            `
        }

      `;


      modalOverlay.classList.add(
        "show"
      );

    }


    // =====================================================
    // CLOSE MODAL
    // =====================================================

    closeModal.addEventListener(
      "click",
      function () {

        modalOverlay.classList.remove(
          "show"
        );


        selectedRowId = null;

      }
    );


    // =====================================================
    // CLICK OUTSIDE MODAL
    // =====================================================

    modalOverlay.addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          modalOverlay
        ) {

          modalOverlay.classList.remove(
            "show"
          );


          selectedRowId = null;

        }

      }
    );


    // =====================================================
    // PROCESS ORDER
    // =====================================================

    modalActionBtn.addEventListener(
      "click",
      function () {


        const row =
          data.find(
            item =>
              item.id ===
              selectedRowId
          );


        if (!row) {
          return;
        }


        // =================================================
        // ONLY FIXED ERROR IDS SHOW ERROR
        // =================================================

        if (row.hasError) {

          showErrorToast(
            row.id
          );


          return;

        }


        // =================================================
        // NORMAL ROW
        // =================================================

        console.log(
          `Order ${row.id} processed successfully`
        );

      }
    );


    // =====================================================
    // ERROR TOAST
    // =====================================================

    let toastTimer;


    function showErrorToast(id) {

      errorToast.innerHTML = `

        <span class="toast-title">
          Error:
        </span>

        Something went wrong
        for Order ${id}.

      `;


      errorToast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          function () {

            errorToast.classList.remove(
              "show"
            );

          },
          3000
        );

    }


    // =====================================================
    // INITIAL RENDER
    // =====================================================

    renderTable();

  </script>

</body>

</html>
